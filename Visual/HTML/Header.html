<header class="header d-flex">
    <section class="header__logo-toggle">
        <a href="Home.html" class="header__brand">
            <img
                src="../../Assets/Logo/template-maze-ezgif.com-png-to-webp-converter.webp"
                alt="logo de web"
                class="header__logo"
                style="height: 75px"
            />
        </a>

        <!-- Botón de menú -->
        <button
            id="menuButton"
            class="header__toggle-menu-btn"
            onclick="toggleMenu()"
            aria-label="Open menu"
        >
            ☰
        </button>
    </section>

    <!-- Menú desplegable -->
    <section id="menu" class="header__nav">
        <!-- Botón para cerrar menú -->
        <button
            id="closeMenuButton"
            class="header__close-menu-btn"
            onclick="toggleMenu()"
            aria-label="Close menu"
        >
            X
        </button>

        <nav class="header__nav-content d-flex">
            <a href="Home.html" class="header__link nav-link">Home</a>
            <a href="Game.html" class="header__link nav-link">Play</a>
            <a href="ContactUs.html" class="header__link nav-link">Contact</a>
        </nav>
    </section>
</header>
